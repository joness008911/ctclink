# Railway Nixpacks Configuration
# Overrides default frozen-lockfile behavior to prevent build failures when dependencies update

[phases.setup]
nixPkgs = ["bun", "nodejs_22"]

[variables]
NODE_OPTIONS = "--import tsx"

[phases.install]
cmds = ["bun install"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm start"

