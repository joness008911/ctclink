# NGINX CONFIGURATION FOR AAPANEL
# Add these rules to your site's Nginx configuration

# Clean URL routing for random campaign URLs (5-12 alphanumeric chars)
location ~ ^/([A-Za-z0-9]{5,12})/?$ {
    try_files $uri $uri/ /r.php?id=$1;
}

# Allow direct access to essential files
location ~ ^/(index\.html|redirect\.php|r\.php|admin_auth\.php|check_auth\.php|get_config\.php|update_config\.php|get_visitors\.php|test_api\.php)$ {
    try_files $uri =404;
}

# Block access to sensitive files
location ~ \.(txt|json|log)$ {
    deny all;
}

location ~ ^/\. {
    deny all;
}

location ~ \.(bak|backup|old|orig|save|swp|tmp)$ {
    deny all;
}

# Route all other requests to redirect.php for bot detection
location / {
    try_files $uri $uri/ /redirect.php?$args;
}