<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Verifying Your Visit</title>
    <meta name="robots" content="noindex, nofollow">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        .verification-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            max-width: 500px;
            width: 90%;
            color: #333;
        }

        .verification-icon {
            font-size: 4em;
            color: #667eea;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        h1 {
            font-size: 2.2em;
            margin-bottom: 15px;
            color: #4a5568;
            font-weight: 700;
        }

        .subtitle {
            font-size: 1.1em;
            color: #718096;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 4px;
        }

        .status-text {
            font-size: 0.95em;
            color: #4a5568;
            margin-bottom: 15px;
            min-height: 20px;
        }

        .security-features {
            display: flex;
            justify-content: space-around;
            margin-top: 25px;
            font-size: 0.85em;
            color: #718096;
        }

        .feature {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .feature-icon {
            font-size: 1.5em;
            color: #667eea;
        }

        .loading-dots {
            display: inline-block;
        }

        .loading-dots::after {
            content: '';
            animation: dots 1.5s steps(5, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }

        .hidden-interaction-test {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 100px;
            background: transparent;
            border: none;
            cursor: pointer;
            opacity: 0;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="verification-container">
        <div class="verification-icon">🛡️</div>
        <h1>Security Verification</h1>
        <p class="subtitle">
            We're performing a quick security check to ensure you're a human visitor. 
            This helps us protect against automated threats and provide you with the best experience.
        </p>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        
        <div class="status-text" id="statusText">
            Initializing security scan<span class="loading-dots"></span>
        </div>
        
        <div class="security-features">
            <div class="feature">
                <div class="feature-icon">🔍</div>
                <div>Behavior Analysis</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🌍</div>
                <div>Location Verification</div>
            </div>
            <div class="feature">
                <div class="feature-icon">⚡</div>
                <div>Real-time Protection</div>
            </div>
        </div>
    </div>

    <!-- Hidden interaction test area -->
    <button class="hidden-interaction-test" id="hiddenTest"></button>

    <!-- Honeypot fields for bot detection -->
    <form style="position: absolute; left: -9999px; top: -9999px;">
        <input type="email" name="email_backup" tabindex="-1" autocomplete="off">
        <input type="text" name="username_extra" tabindex="-1" autocomplete="off">
        <input type="password" name="password_confirm" tabindex="-1" autocomplete="off">
    </form>

    <!-- CleanTraffic Advanced Bot Detection -->
    <script src="bot-detector.js"></script>
    <script>
        // Verification process simulation with real behavioral detection
        let progress = 0;
        let currentStep = 0;
        const steps = [
            'Initializing security scan',
            'Analyzing browser fingerprint',
            'Monitoring interaction patterns',
            'Checking behavioral signals',
            'Verifying human patterns',
            'Finalizing verification'
        ];

        const progressFill = document.getElementById('progressFill');
        const statusText = document.getElementById('statusText');

        function updateProgress() {
            progress += Math.random() * 15 + 5; // Random progress increments
            if (progress > 100) progress = 100;
            
            progressFill.style.width = progress + '%';
            
            // Update status text
            const stepIndex = Math.floor((progress / 100) * steps.length);
            if (stepIndex < steps.length && stepIndex !== currentStep) {
                currentStep = stepIndex;
                statusText.innerHTML = steps[stepIndex] + '<span class="loading-dots"></span>';
            }
            
            if (progress >= 100) {
                finishVerification();
            } else {
                setTimeout(updateProgress, Math.random() * 800 + 400); // Random timing
            }
        }

        function finishVerification() {
            statusText.innerHTML = 'Verification complete! Redirecting...';
            
            // Wait for bot detection to complete
            setTimeout(() => {
                const behaviorData = window.botDetector ? window.botDetector.getCompactData() : {};
                
                // Create form to submit behavioral data
                const form = document.createElement('form');
                form.method = 'POST';
                form.action = 'redirect.php';
                form.style.display = 'none';
                
                // Add behavioral data
                const behaviorInput = document.createElement('input');
                behaviorInput.type = 'hidden';
                behaviorInput.name = 'behavioral_data';
                behaviorInput.value = JSON.stringify(behaviorData);
                form.appendChild(behaviorInput);
                
                // Add referrer if available
                const referrerInput = document.createElement('input');
                referrerInput.type = 'hidden';
                referrerInput.name = 'referrer';
                referrerInput.value = document.referrer || '';
                form.appendChild(referrerInput);
                
                // Add page load time
                const loadTimeInput = document.createElement('input');
                loadTimeInput.type = 'hidden';
                loadTimeInput.name = 'page_load_time';
                loadTimeInput.value = Date.now() - performance.timing.navigationStart;
                form.appendChild(loadTimeInput);
                
                document.body.appendChild(form);
                form.submit();
            }, 1500);
        }

        // Enhanced interaction monitoring
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🔍 Visitor behavioral detection active');
            
            // Add some interactive elements for testing
            const hiddenTest = document.getElementById('hiddenTest');
            hiddenTest.addEventListener('click', function() {
                console.log('Hidden interaction detected');
            });
            
            // Start verification process
            setTimeout(updateProgress, 1000);
            
            // Emergency fallback - redirect after 10 seconds regardless
            setTimeout(() => {
                if (document.body.contains(document.querySelector('.verification-container'))) {
                    console.log('Emergency redirect activated');
                    window.location.href = 'redirect.php';
                }
            }, 10000);
        });

        // Track additional user interactions
        let interactionCount = 0;
        ['mousemove', 'click', 'keydown', 'scroll', 'touchstart'].forEach(event => {
            document.addEventListener(event, function() {
                interactionCount++;
                if (interactionCount === 1) {
                    console.log('First user interaction detected');
                }
            });
        });
    </script>
</body>
</html>
